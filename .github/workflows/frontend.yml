name: Frontend

# El workflow se dispara siempre (así el check nunca queda "pendiente" si se exige en las reglas de
# branch), pero el job pesado se saltea si el cambio no toca el front ni este workflow: lo decide `cambios`.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cambios:
    name: ¿Cambió el front?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      corre: ${{ steps.detectar.outputs.corre }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detectar
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/cambios.py '^frontend/' '^\.github/workflows/frontend\.yml$' '^\.github/scripts/cambios\.py$'

  frontend:
    name: Lint, tipos, tests y build
    needs: cambios
    if: needs.cambios.outputs.corre == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # LTS; el front pide Node 20 o más
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Caché del build de Next (acelera compilaciones repetidas).
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      # Sin variables de entorno: el front usa el mock (ver frontend/.env.example). No hay secretos.
      - name: Build
        run: npm run build
