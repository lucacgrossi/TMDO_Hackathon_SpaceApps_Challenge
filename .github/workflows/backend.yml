name: Backend

# Lint (ruff), tests de pytest sin red y chequeo de que la app importe.
# El workflow se dispara siempre (así el check nunca queda "pendiente" si se exige en las reglas de
# branch), pero el job pesado se saltea si el cambio no toca el back ni este workflow: lo decide `cambios`.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cambios:
    name: ¿Cambió el back?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      corre: ${{ steps.detectar.outputs.corre }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detectar
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/cambios.py '^backend/' '^\.github/workflows/backend\.yml$' '^\.github/scripts/cambios\.py$'

  backend:
    name: Lint, tests y build
    needs: cambios
    if: needs.cambios.outputs.corre == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      # Informativo: parte del código existente no está formateada con ruff y en este PR no se
      # reformatea código ajeno. Cuando cada dueño formatee lo suyo, sacar el continue-on-error.
      - name: Formato (ruff format --check, informativo)
        continue-on-error: true
        run: ruff format --check .

      - name: Tests (pytest, sin red)
        # pytest-socket bloquea cualquier socket: los tests deben usar fixtures, no internet.
        run: python -m pytest --disable-socket

      - name: Build (la app importa)
        run: |
          python -c "import app"
          python - <<'EOF'
          import importlib
          import pkgutil

          import app

          modulos = [m.name for m in pkgutil.walk_packages(app.__path__, "app.")]
          for nombre in modulos:
              importlib.import_module(nombre)
          print(f"OK: {len(modulos)} módulos de app importan")
          EOF
          if [ -f app/main.py ]; then
            python -c "import app.main"
            echo "OK: app.main importa"
          else
            echo "app/main.py todavía no existe: se omite"
          fi
